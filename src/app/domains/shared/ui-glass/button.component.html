<button [class]="buttonClasses()" [disabled]="disabled()" [type]="type()">
  @if (loading()) {
    <div
      class="animate-spin rounded-full h-4 w-4 border-2 border-current border-t-transparent mr-2"
    ></div>
  }
  @if (icon() && !loading()) {
    <span class="mr-2" [innerHTML]="icon()"></span>
  }
  <ng-content />
</button>
